[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deployable-agent-kit"
version = "0.1.0"
description = "Config-driven, customer-deployable LLM agent for financial-services operations: agentic RAG, tool calling, guardrails, tracing and evals."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.25",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
agentkit = "agentkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:You should not use the 'timeout' argument with the TestClient"]
